{% extends "base.html" %}

{% block title %}Contact | FreshCuts{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="display-4 fw-bold text-success">
            Contact Us
        </h1>

        <p class="lead text-muted">
            We'd love to hear from you.
        </p>

    </div>

    <div class="row g-4">

        <div class="col-lg-5">

            <div class="card shadow border-0 h-100">

                <div class="card-body">

                    <h3 class="text-success mb-4">
                        Contact Details
                    </h3>

                    <p>
                        📍 Nalgonda, Telangana
                    </p>

                    <p>
                        📞 +91 9347978532
                    </p>

                    <p>
                        ✉ support@freshcuts.com
                    </p>

                    <p>
                        🕒 9:00 AM - 9:00 PM
                    </p>

                </div>

            </div>

        </div>

        <div class="col-lg-7">

            <div class="card shadow border-0">

                <div class="card-body">

                    <form>

                        <div class="mb-3">

                            <label>Name</label>

                            <input
                                type="text"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="email"
                                class="form-control">

                        </div>

                        <div class="mb-3">

                            <label>Message</label>

                            <textarea
                                rows="5"
                                class="form-control"></textarea>

                        </div>

                        <button class="btn btn-success w-100">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
