{% load static %}

<nav class="navbar">
    <div class="nav-container">

        <!-- Logo -->
        <div class="logo">
            <a href="{% url 'home' %}">
                <img src="{% static 'images/logo.png' %}" alt="FreshCuts Logo">
                <span>FreshCuts</span>
            </a>
        </div>

        <!-- Navigation Links -->
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'products' %}">Products</a></li>
            <li><a href="{% url 'cart' %}">Cart</a></li>
            <li><a href="{% url 'my_orders' %}">My Orders</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>

        <!-- User Section -->
        <div class="nav-actions">

            {% if user.is_authenticated %}

                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>{{ user.first_name|default:user.username }}</span>
                </div>

                <a href="{% url 'logout' %}" class="btn btn-outline">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-primary">
                    Register
                </a>

            {% endif %}

        </div>

    </div>
</nav>
