{% extends 'base.html' %}

{% block title %}
Edit Product
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg">

<div class="card-header bg-dark text-white">

<h3>

Edit Product

</h3>

</div>

<div class="card-body">

<form method="POST"
enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-success">

Update Product

</button>

<a href="{% url 'products' %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
